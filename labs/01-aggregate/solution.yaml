# Lab 1 — Aggregate & filter (solution)
#
# Five MCP servers, 200 tools, one endpoint — and the agent sees only the 8 it needs.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: ship-it
  namespace: default
spec:
  parentRefs:
    - name: aigw-run
      kind: Gateway
      group: gateway.networking.k8s.io
  path: /mcp
  backendRefs:
    - name: issues
      kind: Backend
      group: gateway.envoyproxy.io
      path: /mcp
      toolSelector:
        include: [get_issue, add_comment]

    - name: ci
      kind: Backend
      group: gateway.envoyproxy.io
      path: /mcp
      toolSelector:
        include: [list_pipeline_runs, get_job_logs]

    - name: docs
      kind: Backend
      group: gateway.envoyproxy.io
      path: /mcp
      toolSelector:
        include: [search_docs]

    - name: deploy
      kind: Backend
      group: gateway.envoyproxy.io
      path: /mcp
      toolSelector:
        include: [deploy, get_deployment_status]

    - name: chat
      kind: Backend
      group: gateway.envoyproxy.io
      path: /mcp
      toolSelector:
        include: [post_message]
